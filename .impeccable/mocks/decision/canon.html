<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BrewPoints — Modern Cafe POS & Loyalty Standard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1440px; height: 900px; overflow: hidden;
    background: #F5F5F4; color: #1C1917;
    font-family: 'Inter', sans-serif;
    display: grid; grid-template-columns: 240px 1fr 360px;
  }
  .sidebar { background: #FFFFFF; border-right: 1px solid #E7E5E4; padding: 24px; display: flex; flex-direction: column; gap: 8px; }
  .logo { font-size: 20px; font-weight: 700; color: #D97706; margin-bottom: 24px; }
  .item { padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #57534E; }
  .item.active { background: #FEF3C7; color: #B45309; font-weight: 600; }
  .main { padding: 28px; display: flex; flex-direction: column; gap: 20px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .card { background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 12px; padding: 20px; }
  .val { font-size: 28px; font-weight: 700; margin-top: 6px; }
  .btn { background: #D97706; color: #FFFFFF; border: none; border-radius: 8px; padding: 12px 16px; font-weight: 600; width: 100%; margin-top: 12px; }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="logo">BrewPoints</div>
    <div class="item active">Dashboard & POS</div>
    <div class="item">Rewards Catalog</div>
    <div class="item">Staff Accounts</div>
  </aside>
  <main class="main">
    <h1 style="font-size:24px;font-weight:700;">Store Overview & POS</h1>
    <div class="cards">
      <div class="card"><div style="font-size:13px;color:#78716C;">Points Issued</div><div class="val">1,480</div></div>
      <div class="card"><div style="font-size:13px;color:#78716C;">Redemptions</div><div class="val">34</div></div>
      <div class="card"><div style="font-size:13px;color:#78716C;">Active Members</div><div class="val">219</div></div>
    </div>
    <div class="card" style="flex:1;">
      <h2 style="font-size:18px;font-weight:600;margin-bottom:12px;">Quick Point Allocation</h2>
      <div style="padding:14px;background:#F5F5F4;border-radius:8px;font-size:18px;font-weight:600;">$18.50 USD → +19 Points</div>
      <button class="btn">Allocate Points</button>
    </div>
  </main>
  <aside style="background:#FFFFFF;border-left:1px solid #E7E5E4;padding:24px;">
    <div style="font-size:14px;font-weight:600;margin-bottom:12px;">Customer Mobile Wallet</div>
    <div class="card" style="text-align:center;">
      <div style="font-size:32px;font-weight:700;color:#D97706;">164 pts</div>
      <div style="width:140px;height:140px;background:#E7E5E4;margin:16px auto;border-radius:8px;"></div>
      <button class="btn">Show QR Code</button>
    </div>
  </aside>
</body>
</html>
